<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <!-- Night Sky Base -->
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#010309"/>
      <stop offset="40%" stop-color="#020817"/>
      <stop offset="75%" stop-color="#041424"/>
      <stop offset="100%" stop-color="#08232e"/>
    </linearGradient>

    <!-- Aurora Wave Gradients -->
    <linearGradient id="auroraGlow1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0"/>
      <stop offset="15%" stop-color="#10b981" stop-opacity="0.3"/>
      <stop offset="40%" stop-color="#34d399" stop-opacity="0.75"/>
      <stop offset="65%" stop-color="#22d3ee" stop-opacity="0.6"/>
      <stop offset="90%" stop-color="#059669" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="auroraGlow2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0"/>
      <stop offset="25%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#6ee7b7" stop-opacity="0.8"/>
      <stop offset="80%" stop-color="#10b981" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>

    <!-- Aurora Vertical Fade Mask -->
    <linearGradient id="auroraMaskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="65%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <mask id="auroraMask">
      <rect width="1200" height="240" fill="url(#auroraMaskGrad)"/>
    </mask>

    <!-- Meteor Gradients -->
    <linearGradient id="mGradWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="60%" stop-color="#f8fafc" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>

    <linearGradient id="mGradBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="1"/>
    </linearGradient>

    <linearGradient id="mGradGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0"/>
      <stop offset="60%" stop-color="#34d399" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#a7f3d0" stop-opacity="1"/>
    </linearGradient>

    <!-- Blur filter for soft glowing aurora -->
    <filter id="auroraBlur" x="-30%" y="-40%" width="160%" height="180%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>

    <filter id="starGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    /* 1. ท้องฟ้าและดวงดาวค่อยๆ ลอยไปทางขวาเรื่อยๆ */
    @keyframes driftRight {
      0% { transform: translateX(-120px); }
      100% { transform: translateX(60px); }
    }
    .sky-drift-right {
      animation: driftRight 45s linear infinite alternate;
    }

    /* 2. แสงเหนือพลิ้วไหวและเปลี่ยนเฉด */
    @keyframes auroraRipple1 {
      0%, 100% {
        transform: translateX(-40px) skewX(-2deg) scaleY(1);
        opacity: 0.6;
      }
      50% {
        transform: translateX(30px) skewX(4deg) scaleY(1.25);
        opacity: 0.95;
      }
    }

    @keyframes auroraRipple2 {
      0%, 100% {
        transform: translateX(20px) skewX(3deg) scaleY(1.15);
        opacity: 0.5;
      }
      50% {
        transform: translateX(-35px) skewX(-4deg) scaleY(0.9);
        opacity: 0.9;
      }
    }

    @keyframes auroraColorPulse {
      0%, 100% { filter: hue-rotate(0deg); opacity: 0.7; }
      50% { filter: hue-rotate(25deg); opacity: 1; }
    }

    .aurora-wave1 {
      animation: auroraRipple1 12s ease-in-out infinite, auroraColorPulse 16s ease-in-out infinite;
      transform-origin: 450px 80px;
    }

    .aurora-wave2 {
      animation: auroraRipple2 15s ease-in-out infinite;
      transform-origin: 450px 100px;
    }

    /* ดวงดาวกะพริบ */
    @keyframes starPulseA { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
    @keyframes starPulseB { 0%, 100% { opacity: 0.9; } 50% { opacity: 0.2; } }
    .sp-a { animation: starPulseA 3s infinite ease-in-out; }
    .sp-b { animation: starPulseB 4s infinite ease-in-out; }

    /* 3. ดาวตกพุ่งตกลงมาแบบเนียนๆ ไม่มีเส้นค้าง */
    .meteor {
      opacity: 0;
    }

    @keyframes shoot {
      0% {
        transform: translate(0, 0);
        opacity: 0;
      }
      2% {
        opacity: 1;
      }
      12% {
        transform: translate(240px, 150px);
        opacity: 0;
      }
      100% {
        transform: translate(240px, 150px);
        opacity: 0;
      }
    }

    .meteor-1 { animation: shoot 4.5s infinite cubic-bezier(0.25, 0.1, 0.25, 1) -0.5s; }
    .meteor-2 { animation: shoot 5.2s infinite cubic-bezier(0.25, 0.1, 0.25, 1) -2.1s; }
    .meteor-3 { animation: shoot 4.8s infinite cubic-bezier(0.25, 0.1, 0.25, 1) -3.7s; }
    .meteor-4 { animation: shoot 5.6s infinite cubic-bezier(0.25, 0.1, 0.25, 1) -1.2s; }
    .meteor-5 { animation: shoot 4.2s infinite cubic-bezier(0.25, 0.1, 0.25, 1) -2.9s; }
  </style>

  <clipPath id="cardClip">
    <rect width="900" height="240" rx="16" ry="16"/>
  </clipPath>

  <g clip-path="url(#cardClip)">
    <!-- Base Sky -->
    <rect width="900" height="240" fill="url(#nightSky)"/>

    <!-- ==================== 1. MOVING SKY (DRIFTING TO THE RIGHT) ==================== -->
    <g class="sky-drift-right">
      <!-- Stars Layer 1 (White) -->
      <g fill="#ffffff" class="sp-a">
        <circle cx="20" cy="30" r="1"/><circle cx="70" cy="80" r="1.3"/><circle cx="130" cy="25" r="0.9"/>
        <circle cx="190" cy="65" r="1.2"/><circle cx="250" cy="35" r="1.4"/><circle cx="310" cy="85" r="1"/>
        <circle cx="380" cy="30" r="1.2"/><circle cx="440" cy="75" r="1.5"/><circle cx="510" cy="40" r="1"/>
        <circle cx="580" cy="80" r="1.3"/><circle cx="650" cy="25" r="1.1"/><circle cx="720" cy="70" r="1.4"/>
        <circle cx="790" cy="35" r="1"/><circle cx="850" cy="85" r="1.3"/><circle cx="920" cy="30" r="1.2"/>
        <circle cx="980" cy="75" r="1.4"/><circle cx="1040" cy="35" r="1"/>
      </g>

      <!-- Stars Layer 2 (Cyan/Mint) -->
      <g fill="#a7f3d0" class="sp-b">
        <circle cx="45" cy="60" r="1.2"/><circle cx="105" cy="40" r="1"/><circle cx="165" cy="85" r="1.4"/>
        <circle cx="225" cy="20" r="1.1"/><circle cx="285" cy="65" r="1.3"/><circle cx="350" cy="45" r="1"/>
        <circle cx="410" cy="95" r="1.4"/><circle cx="475" cy="25" r="1"/><circle cx="545" cy="65" r="1.3"/>
        <circle cx="615" cy="45" r="1.1"/><circle cx="685" cy="85" r="1.4"/><circle cx="755" cy="20" r="1"/>
        <circle cx="820" cy="65" r="1.3"/><circle cx="890" cy="40" r="1.1"/><circle cx="955" cy="90" r="1.3"/>
        <circle cx="1015" cy="55" r="1.2"/>
      </g>

      <!-- Stars Layer 3 (Star Dust) -->
      <g fill="#bae6fd" opacity="0.6">
        <circle cx="10" cy="50" r="0.6"/><circle cx="55" cy="110" r="0.7"/><circle cx="95" cy="65" r="0.6"/>
        <circle cx="145" cy="100" r="0.8"/><circle cx="180" cy="45" r="0.6"/><circle cx="235" cy="110" r="0.7"/>
        <circle cx="270" cy="55" r="0.6"/><circle cx="330" cy="95" r="0.8"/><circle cx="365" cy="30" r="0.7"/>
        <circle cx="425" cy="110" r="0.6"/><circle cx="460" cy="55" r="0.7"/><circle cx="525" cy="105" r="0.8"/>
        <circle cx="565" cy="35" r="0.6"/><circle cx="630" cy="115" r="0.7"/><circle cx="665" cy="50" r="0.6"/>
        <circle cx="735" cy="105" r="0.8"/><circle cx="775" cy="45" r="0.7"/><circle cx="835" cy="110" r="0.6"/>
        <circle cx="875" cy="55" r="0.7"/><circle cx="935" cy="105" r="0.8"/><circle cx="995" cy="45" r="0.6"/>
        <circle cx="1055" cy="85" r="0.7"/>
      </g>

      <!-- Major Bright Stars with Glow -->
      <g fill="#ffffff" filter="url(#starGlow)">
        <circle cx="310" cy="45" r="2.2" class="sp-a"/>
        <circle cx="580" cy="50" r="2.4" class="sp-b"/>
        <circle cx="780" cy="38" r="2.0" class="sp-a"/>
        <circle cx="150" cy="70" r="1.9" class="sp-b"/>
        <circle cx="950" cy="45" r="2.1" class="sp-a"/>
      </g>
    </g>

    <!-- ==================== 2. WAVING NORTHERN LIGHTS (AURORA) ==================== -->
    <g mask="url(#auroraMask)" filter="url(#auroraBlur)">
      <!-- Main Aurora Ribbon -->
      <path class="aurora-wave1" d="M -80,60 Q 150,15 380,55 T 820,40 T 1100,55 L 1100,165 L -80,165 Z" fill="url(#auroraGlow1)"/>
      
      <!-- Secondary Shimmering Curtain -->
      <path class="aurora-wave2" d="M -80,85 Q 220,40 500,80 T 920,45 T 1100,75 L 1100,175 L -80,175 Z" fill="url(#auroraGlow2)"/>
    </g>

    <!-- ==================== 3. CLEAN FALLING METEORS (NO STATIC LINES) ==================== -->
    <!-- ทุกดวงเริ่มต้นจากนอกขอบจอด้านบน (y = -40) และตกลงมาทีละดวงอย่างเป็นธรรมชาติ -->

    <!-- Meteor 1: สีขาว -->
    <g transform="translate(80, -40)" class="meteor meteor-1">
      <line x1="-50" y1="-31" x2="0" y2="0" stroke="url(#mGradWhite)" stroke-width="2.2" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="2.2" fill="#ffffff" filter="url(#starGlow)"/>
    </g>

    <!-- Meteor 2: สีฟ้า -->
    <g transform="translate(320, -40)" class="meteor-2 meteor">
      <line x1="-50" y1="-31" x2="0" y2="0" stroke="url(#mGradBlue)" stroke-width="2.2" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="2.1" fill="#bae6fd" filter="url(#starGlow)"/>
    </g>

    <!-- Meteor 3: สีเขียวมรกต -->
    <g transform="translate(560, -40)" class="meteor-3 meteor">
      <line x1="-55" y1="-34" x2="0" y2="0" stroke="url(#mGradGreen)" stroke-width="2.4" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="2.2" fill="#a7f3d0" filter="url(#starGlow)"/>
    </g>

    <!-- Meteor 4: สีขาว -->
    <g transform="translate(740, -40)" class="meteor-4 meteor">
      <line x1="-50" y1="-31" x2="0" y2="0" stroke="url(#mGradWhite)" stroke-width="2.0" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="2.0" fill="#ffffff" filter="url(#starGlow)"/>
    </g>

    <!-- Meteor 5: สีเขียวมิ้นต์ -->
    <g transform="translate(200, -40)" class="meteor-5 meteor">
      <line x1="-50" y1="-31" x2="0" y2="0" stroke="url(#mGradGreen)" stroke-width="2.1" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="2.0" fill="#6ee7b7" filter="url(#starGlow)"/>
    </g>

    <!-- ==================== PINE FOREST SILHOUETTES ==================== -->
    <path d="M 0,205 
      L 15,190 L 30,205 L 45,185 L 60,208 L 75,192 L 95,210 L 115,180 L 135,212 L 155,195 L 180,215 
      L 205,182 L 230,210 L 255,190 L 280,212 L 310,185 L 335,210 L 360,195 L 390,215 L 420,180 
      L 450,210 L 480,188 L 515,212 L 545,182 L 575,210 L 605,190 L 635,215 L 670,185 L 700,210 
      L 730,192 L 760,215 L 795,180 L 825,210 L 855,188 L 880,212 L 900,195 L 900,240 L 0,240 Z" 
      fill="#03131c" opacity="0.85"/>

    <path d="M -10,240 
      L 5,175 L 20,205 L 35,165 L 50,205 L 70,160 L 90,208 L 110,170 L 130,210 
      L 150,155 L 175,215 L 200,175 L 225,210 L 250,160 L 275,208 L 305,170 L 330,212 
      L 355,150 L 380,215 L 410,165 L 440,210 L 470,155 L 500,212 L 530,168 L 560,210 
      L 590,145 L 620,212 L 650,160 L 680,208 L 710,150 L 740,212 L 770,165 L 800,210 
      L 830,155 L 860,208 L 885,160 L 910,240 Z" 
      fill="#010406"/>

    <polygon points="50,145 42,165 47,165 38,185 45,185 32,210 68,210 55,185 62,185 53,165 58,165" fill="#010406"/>
    <polygon points="120,135 110,160 116,160 105,185 112,185 98,215 142,215 128,185 135,185 124,160 130,160" fill="#010406"/>
    <polygon points="360,132 350,155 356,155 345,180 352,180 338,210 382,210 370,180 376,180 366,155 372,155" fill="#010406"/>
    <polygon points="695,130 685,155 692,155 680,180 688,180 675,212 715,212 702,180 710,180 698,155 705,155" fill="#010406"/>

    <!-- Outer Border Glow -->
    <rect width="900" height="240" rx="16" ry="16" fill="none" stroke="#34d399" stroke-opacity="0.3" stroke-width="1.5"/>
  </g>
</svg>
