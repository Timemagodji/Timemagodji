<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <!-- Deep Space Sky Gradient -->
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#02040a"/>
      <stop offset="30%" stop-color="#060c1d"/>
      <stop offset="65%" stop-color="#0c1735"/>
      <stop offset="100%" stop-color="#152449"/>
    </linearGradient>

    <!-- Milky Way / Cosmic Nebula Glow -->
    <radialGradient id="nebulaGlow" cx="45%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.22"/>
      <stop offset="35%" stop-color="#60a5fa" stop-opacity="0.14"/>
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#02040a" stop-opacity="0"/>
    </radialGradient>

    <!-- Meteor Trail Gradient -->
    <linearGradient id="meteorTail" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="45%" stop-color="#7dd3fc" stop-opacity="0.5"/>
      <stop offset="80%" stop-color="#e0f2fe" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="starGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    /* Twinkling stars */
    @keyframes twinkleA { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
    @keyframes twinkleB { 0%, 100% { opacity: 0.9; } 50% { opacity: 0.2; } }
    @keyframes twinkleC { 0%, 100% { opacity: 0.3; } 35% { opacity: 0.95; } 75% { opacity: 0.4; } }
    
    .tw-a { animation: twinkleA 2.6s infinite ease-in-out; }
    .tw-b { animation: twinkleB 3.8s infinite ease-in-out; }
    .tw-c { animation: twinkleC 4.6s infinite ease-in-out; }

    /* Meteor Shower Trails */
    @keyframes streak1 {
      0% { transform: translate(0, 0); opacity: 0; }
      4% { opacity: 1; }
      22% { transform: translate(280px, 175px); opacity: 0; }
      100% { transform: translate(280px, 175px); opacity: 0; }
    }
    @keyframes streak2 {
      0% { transform: translate(0, 0); opacity: 0; }
      5% { opacity: 1; }
      24% { transform: translate(240px, 150px); opacity: 0; }
      100% { transform: translate(240px, 150px); opacity: 0; }
    }
    @keyframes streak3 {
      0% { transform: translate(0, 0); opacity: 0; }
      4% { opacity: 1; }
      20% { transform: translate(320px, 200px); opacity: 0; }
      100% { transform: translate(320px, 200px); opacity: 0; }
    }
    @keyframes streak4 {
      0% { transform: translate(0, 0); opacity: 0; }
      6% { opacity: 1; }
      25% { transform: translate(230px, 144px); opacity: 0; }
      100% { transform: translate(230px, 144px); opacity: 0; }
    }
    @keyframes streak5 {
      0% { transform: translate(0, 0); opacity: 0; }
      4% { opacity: 1; }
      22% { transform: translate(260px, 162px); opacity: 0; }
      100% { transform: translate(260px, 162px); opacity: 0; }
    }

    .m-1 { animation: streak1 4.2s infinite cubic-bezier(0.2, 0, 0.4, 1) 0.2s; }
    .m-2 { animation: streak2 5.6s infinite cubic-bezier(0.2, 0, 0.4, 1) 2.2s; }
    .m-3 { animation: streak3 4.8s infinite cubic-bezier(0.2, 0, 0.4, 1) 1.1s; }
    .m-4 { animation: streak4 6.4s infinite cubic-bezier(0.2, 0, 0.4, 1) 3.5s; }
    .m-5 { animation: streak5 5.2s infinite cubic-bezier(0.2, 0, 0.4, 1) 4.6s; }
  </style>

  <!-- Card Clipping with rounded corners -->
  <clipPath id="cardClip">
    <rect width="900" height="240" rx="16" ry="16"/>
  </clipPath>

  <g clip-path="url(#cardClip)">
    <!-- Night Sky Base Gradient -->
    <rect width="900" height="240" fill="url(#nightSky)"/>
    <!-- Nebula Dust Glow -->
    <rect width="900" height="240" fill="url(#nebulaGlow)"/>

    <!-- Stars: Layer A (White Shimmer) -->
    <g fill="#ffffff" class="tw-a">
      <circle cx="45" cy="28" r="1"/>
      <circle cx="120" cy="75" r="1.2"/>
      <circle cx="210" cy="35" r="0.9"/>
      <circle cx="280" cy="90" r="1.4"/>
      <circle cx="360" cy="40" r="1"/>
      <circle cx="430" cy="85" r="1.3"/>
      <circle cx="510" cy="30" r="1"/>
      <circle cx="590" cy="70" r="1.5"/>
      <circle cx="670" cy="45" r="1.1"/>
      <circle cx="750" cy="80" r="1.3"/>
      <circle cx="830" cy="35" r="1"/>
      <circle cx="875" cy="95" r="1.2"/>
    </g>

    <!-- Stars: Layer B (Cyan/Blue Shimmer) -->
    <g fill="#93c5fd" class="tw-b">
      <circle cx="85" cy="55" r="1.2"/>
      <circle cx="160" cy="25" r="1"/>
      <circle cx="240" cy="65" r="1.5"/>
      <circle cx="310" cy="20" r="1.1"/>
      <circle cx="395" cy="60" r="1.3"/>
      <circle cx="475" cy="45" r="1"/>
      <circle cx="550" cy="95" r="1.4"/>
      <circle cx="630" cy="25" r="1"/>
      <circle cx="710" cy="60" r="1.5"/>
      <circle cx="790" cy="20" r="1.1"/>
      <circle cx="860" cy="65" r="1.3"/>
    </g>

    <!-- Stars: Layer C (Dense Background Star Dust) -->
    <g fill="#e0e7ff" opacity="0.6" class="tw-c">
      <circle cx="25" cy="45" r="0.6"/>
      <circle cx="65" cy="110" r="0.6"/>
      <circle cx="105" cy="40" r="0.7"/>
      <circle cx="140" cy="100" r="0.8"/>
      <circle cx="185" cy="60" r="0.6"/>
      <circle cx="225" cy="115" r="0.7"/>
      <circle cx="260" cy="50" r="0.6"/>
      <circle cx="330" cy="75" r="0.8"/>
      <circle cx="375" cy="110" r="0.6"/>
      <circle cx="415" cy="30" r="0.7"/>
      <circle cx="450" cy="65" r="0.7"/>
      <circle cx="490" cy="110" r="0.8"/>
      <circle cx="530" cy="55" r="0.6"/>
      <circle cx="570" cy="115" r="0.7"/>
      <circle cx="610" cy="40" r="0.6"/>
      <circle cx="655" cy="75" r="0.8"/>
      <circle cx="700" cy="30" r="0.6"/>
      <circle cx="735" cy="110" r="0.6"/>
      <circle cx="770" cy="50" r="0.7"/>
      <circle cx="815" cy="95" r="0.8"/>
      <circle cx="850" cy="35" r="0.7"/>
      <circle cx="885" cy="60" r="0.6"/>
    </g>

    <!-- Glowing Major Stars -->
    <g fill="#ffffff" filter="url(#starGlow)">
      <circle cx="340" cy="45" r="2" class="tw-a"/>
      <circle cx="585" cy="60" r="2.2" class="tw-b"/>
      <circle cx="760" cy="35" r="1.8" class="tw-a"/>
      <circle cx="190" cy="80" r="1.8" class="tw-b"/>
      <circle cx="465" cy="90" r="1.6" class="tw-c"/>
    </g>

    <!-- ==================== METEOR SHOWER ==================== -->
    <!-- Meteor 1 -->
    <g class="m-1">
      <line x1="60" y1="5" x2="150" y2="61" stroke="url(#meteorTail)" stroke-width="2.2" stroke-linecap="round"/>
      <circle cx="150" cy="61" r="2.2" fill="#ffffff" filter="url(#starGlow)"/>
    </g>

    <!-- Meteor 2 -->
    <g class="m-2">
      <line x1="310" y1="0" x2="390" y2="50" stroke="url(#meteorTail)" stroke-width="1.8" stroke-linecap="round"/>
      <circle cx="390" cy="50" r="1.8" fill="#ffffff" filter="url(#starGlow)"/>
    </g>

    <!-- Meteor 3 (Bright Lead Meteor) -->
    <g class="m-3">
      <line x1="530" y1="8" x2="635" y2="74" stroke="url(#meteorTail)" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="635" cy="74" r="2.5" fill="#ffffff" filter="url(#starGlow)"/>
    </g>

    <!-- Meteor 4 -->
    <g class="m-4">
      <line x1="210" y1="20" x2="285" y2="67" stroke="url(#meteorTail)" stroke-width="1.6" stroke-linecap="round"/>
      <circle cx="285" cy="67" r="1.6" fill="#ffffff" filter="url(#starGlow)"/>
    </g>

    <!-- Meteor 5 -->
    <g class="m-5">
      <line x1="710" y1="12" x2="790" y2="62" stroke="url(#meteorTail)" stroke-width="2" stroke-linecap="round"/>
      <circle cx="790" cy="62" r="2" fill="#ffffff" filter="url(#starGlow)"/>
    </g>

    <!-- ==================== PINE FOREST SILHOUETTES ==================== -->
    <!-- Distant Forest Layer -->
    <path d="M 0,205 
      L 15,190 L 30,205 L 45,185 L 60,208 L 75,192 L 95,210 L 115,180 L 135,212 L 155,195 L 180,215 
      L 205,182 L 230,210 L 255,190 L 280,212 L 310,185 L 335,210 L 360,195 L 390,215 L 420,180 
      L 450,210 L 480,188 L 515,212 L 545,182 L 575,210 L 605,190 L 635,215 L 670,185 L 700,210 
      L 730,192 L 760,215 L 795,180 L 825,210 L 855,188 L 880,212 L 900,195 L 900,240 L 0,240 Z" 
      fill="#050a16" opacity="0.85"/>

    <!-- Foreground Dense Pine Silhouettes -->
    <path d="M -10,240 
      L 5,175 L 20,205 L 35,165 L 50,205 L 70,160 L 90,208 L 110,170 L 130,210 
      L 150,155 L 175,215 L 200,175 L 225,210 L 250,160 L 275,208 L 305,170 L 330,212 
      L 355,150 L 380,215 L 410,165 L 440,210 L 470,155 L 500,212 L 530,168 L 560,210 
      L 590,145 L 620,212 L 650,160 L 680,208 L 710,150 L 740,212 L 770,165 L 800,210 
      L 830,155 L 860,208 L 885,160 L 910,240 Z" 
      fill="#010307"/>

    <!-- Prominent pine crowns -->
    <polygon points="50,145 42,165 47,165 38,185 45,185 32,210 68,210 55,185 62,185 53,165 58,165" fill="#010307"/>
    <polygon points="120,135 110,160 116,160 105,185 112,185 98,215 142,215 128,185 135,185 124,160 130,160" fill="#010307"/>
    <polygon points="360,132 350,155 356,155 345,180 352,180 338,210 382,210 370,180 376,180 366,155 372,155" fill="#010307"/>
    <polygon points="695,130 685,155 692,155 680,180 688,180 675,212 715,212 702,180 710,180 698,155 705,155" fill="#010307"/>

    <!-- Outer Border Glow -->
    <rect width="900" height="240" rx="16" ry="16" fill="none" stroke="#60a5fa" stroke-opacity="0.3" stroke-width="1.5"/>
  </g>
</svg>
