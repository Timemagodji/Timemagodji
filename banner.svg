<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <!-- Night Sky Base (Electric Indigo Tone) -->
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#02030a"/>
      <stop offset="40%" stop-color="#05081c"/>
      <stop offset="75%" stop-color="#0b1238"/>
      <stop offset="100%" stop-color="#121b52"/>
    </linearGradient>

    <!-- Aurora Wave Gradients (Cobalt, Royal Blue and Indigo) -->
    <linearGradient id="auroraGlow1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0"/>
      <stop offset="15%" stop-color="#3b82f6" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#2563eb" stop-opacity="0.8"/>
      <stop offset="65%" stop-color="#38bdf8" stop-opacity="0.65"/>
      <stop offset="90%" stop-color="#4f46e5" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="auroraGlow2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#172554" stop-opacity="0"/>
      <stop offset="25%" stop-color="#60a5fa" stop-opacity="0.4"/>
      <stop offset="55%" stop-color="#3b82f6" stop-opacity="0.85"/>
      <stop offset="80%" stop-color="#1d44e3" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#172554" stop-opacity="0"/>
    </linearGradient>

    <!-- Aurora Vertical Fade Mask -->
    <linearGradient id="auroraMaskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="65%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <mask id="auroraMask">
      <rect width="1200" height="240" fill="url(#auroraMaskGrad)"/>
    </mask>

    <!-- Meteor Gradients (Down-Right: tail at top-left, head at bottom-right) -->
    <linearGradient id="mGradWhiteR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="60%" stop-color="#f8fafc" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>

    <linearGradient id="mGradBlueR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="1"/>
    </linearGradient>

    <linearGradient id="mGradIndigoR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0"/>
      <stop offset="60%" stop-color="#818cf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#c7d2fe" stop-opacity="1"/>
    </linearGradient>

    <!-- Meteor Gradients (Down-Left: tail at top-right, head at bottom-left) -->
    <linearGradient id="mGradWhiteL" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="60%" stop-color="#f8fafc" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>

    <linearGradient id="mGradBlueL" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="1"/>
    </linearGradient>

    <linearGradient id="mGradIndigoL" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0"/>
      <stop offset="60%" stop-color="#818cf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#c7d2fe" stop-opacity="1"/>
    </linearGradient>

    <!-- Blur filter for soft glowing aurora -->
    <filter id="auroraBlur" x="-30%" y="-40%" width="160%" height="180%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>

    <filter id="starGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    /* 1. Fast Sky Drift (เคลื่อนท้องฟ้าเร็วขึ้น ชัดเจน สมูท) */
    @keyframes driftRight {
      0% { transform: translateX(-100px); }
      100% { transform: translateX(50px); }
    }
    .sky-drift-right {
      animation: driftRight 12s ease-in-out infinite alternate;
    }

    /* 2. Fast Aurora Ripples (คลื่นแสงเหนือพลิ้วไหวรวดเร็ว มีชีวิตชีวา) */
    @keyframes auroraRipple1 {
      0%, 100% {
        transform: translateX(-40px) skewX(-2deg) scaleY(1);
        opacity: 0.6;
      }
      50% {
        transform: translateX(30px) skewX(4deg) scaleY(1.25);
        opacity: 0.95;
      }
    }

    @keyframes auroraRipple2 {
      0%, 100% {
        transform: translateX(25px) skewX(3deg) scaleY(1.15);
        opacity: 0.5;
      }
      50% {
        transform: translateX(-35px) skewX(-4deg) scaleY(0.9);
        opacity: 0.9;
      }
    }

    @keyframes auroraColorPulse {
      0%, 100% { filter: hue-rotate(0deg); opacity: 0.7; }
      50% { filter: hue-rotate(25deg); opacity: 1; }
    }

    .aurora-wave1 {
      animation: auroraRipple1 5s ease-in-out infinite, auroraColorPulse 7s ease-in-out infinite;
      transform-origin: 450px 80px;
    }

    .aurora-wave2 {
      animation: auroraRipple2 6s ease-in-out infinite;
      transform-origin: 450px 100px;
    }

    /* 3. Star pulse animation */
    @keyframes starPulseA { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
    @keyframes starPulseB { 0%, 100% { opacity: 0.95; } 50% { opacity: 0.2; } }
    .sp-a { animation: starPulseA 1.6s infinite ease-in-out; }
    .sp-b { animation: starPulseB 2.0s infinite ease-in-out; }

    /* 4. Progressive Sweeping Meteor Keyframes (พุ่งเร็ว 0.7s) */
    /* ทิศทาง A: พุ่งเฉียงลงขวา (East-bound) */
    @keyframes fallEast {
      0% { transform: translate(0, 0); opacity: 0; }
      3% { opacity: 1; }
      13% { transform: translate(160px, 120px); opacity: 0.9; }
      16% { transform: translate(180px, 135px); opacity: 0; }
      100% { transform: translate(180px, 135px); opacity: 0; }
    }

    /* ทิศทาง B: พุ่งชันทางขวา (Steep East-bound สำรองสำหรับฝั่งขวา) */
    @keyframes fallEastSteep {
      0% { transform: translate(0, 0); opacity: 0; }
      3% { opacity: 1; }
      13% { transform: translate(90px, 140px); opacity: 0.9; }
      16% { transform: translate(105px, 160px); opacity: 0; }
      100% { transform: translate(105px, 160px); opacity: 0; }
    }

    /* ทิศทาง C: พุ่งเฉียงลงซ้าย (West-bound สำหรับขอบขวาสุดพุ่งตัดกลับเข้าจอ) */
    @keyframes fallWest {
      0% { transform: translate(0, 0); opacity: 0; }
      3% { opacity: 1; }
      13% { transform: translate(-100px, 135px); opacity: 0.9; }
      16% { transform: translate(-115px, 155px); opacity: 0; }
      100% { transform: translate(-115px, 155px); opacity: 0; }
    }

    /* กำหนดจังหวะ Sweep จากซ้ายไปขวาเรื่อยๆ ตลอดรอบเวลา 5.2 วินาที */
    /* Wave 1: เริ่มจากซ้ายสุด (x=50) ไล่ไปขวาสุด (x=860) */
    .sw-1 { opacity: 0; animation: fallEast 5.2s cubic-bezier(0.15, 0.85, 0.35, 1) infinite; animation-delay: 0.0s; }
    .sw-2 { opacity: 0; animation: fallEast 5.2s cubic-bezier(0.15, 0.85, 0.35, 1) infinite; animation-delay: 0.5s; }
    .sw-3 { opacity: 0; animation: fallEast 5.2s cubic-bezier(0.15, 0.85, 0.35, 1) infinite; animation-delay: 1.0s; }
    .sw-4 { opacity: 0; animation: fallEast 5.2s cubic-bezier(0.15, 0.85, 0.35, 1) infinite; animation-delay: 1.5s; }
    .sw-5 { opacity: 0; animation: fallEast 5.2s cubic-bezier(0.15, 0.85, 0.35, 1) infinite; animation-delay: 2.0s; }
    .sw-6 { opacity: 0; animation: fallEastSteep 5.2s cubic-bezier(0.15, 0.85, 0.35, 1) infinite; animation-delay: 2.5s; }
    .sw-7 { opacity: 0; animation: fallWest 5.2s cubic-bezier(0.15, 0.85, 0.35, 1) infinite; animation-delay: 3.0s; }

    /* Wave 2: ระลอกที่ 2 เหลื่อมจังหวะ ไล่ตามจากซ้ายไปขวาติดๆ กัน */
    .sw-8  { opacity: 0; animation: fallEast 5.2s cubic-bezier(0.15, 0.85, 0.35, 1) infinite; animation-delay: 1.6s; }
    .sw-9  { opacity: 0; animation: fallEast 5.2s cubic-bezier(0.15, 0.85, 0.35, 1) infinite; animation-delay: 2.1s; }
    .sw-10 { opacity: 0; animation: fallEast 5.2s cubic-bezier(0.15, 0.85, 0.35, 1) infinite; animation-delay: 2.6s; }
    .sw-11 { opacity: 0; animation: fallEast 5.2s cubic-bezier(0.15, 0.85, 0.35, 1) infinite; animation-delay: 3.1s; }
    .sw-12 { opacity: 0; animation: fallEast 5.2s cubic-bezier(0.15, 0.85, 0.35, 1) infinite; animation-delay: 3.6s; }
    .sw-13 { opacity: 0; animation: fallEastSteep 5.2s cubic-bezier(0.15, 0.85, 0.35, 1) infinite; animation-delay: 4.1s; }
    .sw-14 { opacity: 0; animation: fallWest 5.2s cubic-bezier(0.15, 0.85, 0.35, 1) infinite; animation-delay: 4.6s; }
  </style>

  <!-- Clip Path to avoid spillover -->
  <clipPath id="cardClip">
    <rect width="900" height="240" rx="16" ry="16"/>
  </clipPath>

  <g clip-path="url(#cardClip)">
    <!-- Base Sky -->
    <rect width="900" height="240" fill="url(#nightSky)"/>

    <!-- ==================== 1. STARS BACKGROUND (MOVING SKY) ==================== -->
    <g class="sky-drift-right">
      <!-- Dim/Medium Background Stars -->
      <g fill="#ffffff" class="sp-a">
        <circle cx="20" cy="40" r="1.1"/><circle cx="80" cy="85" r="0.9"/><circle cx="130" cy="25" r="1.2"/>
        <circle cx="190" cy="70" r="0.8"/><circle cx="240" cy="115" r="1.0"/><circle cx="300" cy="30" r="1.1"/>
        <circle cx="350" cy="80" r="0.8"/><circle cx="410" cy="45" r="1.2"/><circle cx="470" cy="95" r="0.9"/>
        <circle cx="530" cy="20" r="1.0"/><circle cx="590" cy="75" r="1.1"/><circle cx="640" cy="110" r="0.8"/>
        <circle cx="700" cy="40" r="1.2"/><circle cx="750" cy="85" r="0.9"/><circle cx="810" cy="25" r="1.0"/>
        <circle cx="860" cy="70" r="1.1"/><circle cx="920" cy="35" r="0.8"/><circle cx="970" cy="90" r="1.2"/>
        <circle cx="1020" cy="50" r="0.9"/><circle cx="1080" cy="80" r="1.0"/>
      </g>

      <g fill="#c7d2fe" class="sp-b">
        <circle cx="45" cy="100" r="1.0"/><circle cx="110" cy="50" r="1.3"/><circle cx="165" cy="110" r="0.9"/>
        <circle cx="220" cy="35" r="1.1"/><circle cx="280" cy="90" r="1.2"/><circle cx="340" cy="50" r="0.8"/>
        <circle cx="395" cy="105" r="1.1"/><circle cx="445" cy="30" r="1.3"/><circle cx="505" cy="65" r="0.9"/>
        <circle cx="560" cy="115" r="1.1"/><circle cx="620" cy="40" r="1.2"/><circle cx="675" cy="95" r="0.8"/>
        <circle cx="730" cy="60" r="1.3"/><circle cx="785" cy="105" r="0.9"/><circle cx="845" cy="40" r="1.1"/>
        <circle cx="900" cy="85" r="1.2"/><circle cx="955" cy="60" r="0.8"/><circle cx="1010" cy="110" r="1.1"/>
        <circle cx="1065" cy="35" r="1.0"/>
      </g>

      <!-- Tiny Distant Stars -->
      <g fill="#bae6fd" opacity="0.6">
        <circle cx="35" cy="65" r="0.7"/><circle cx="65" cy="20" r="0.8"/><circle cx="95" cy="115" r="0.6"/>
        <circle cx="145" cy="60" r="0.7"/><circle cx="175" cy="95" r="0.6"/><circle cx="210" cy="110" r="0.7"/>
        <circle cx="270" cy="55" r="0.6"/><circle cx="330" cy="95" r="0.8"/><circle cx="365" cy="30" r="0.7"/>
        <circle cx="425" cy="110" r="0.6"/><circle cx="460" cy="55" r="0.7"/><circle cx="525" cy="105" r="0.8"/>
        <circle cx="565" cy="35" r="0.6"/><circle cx="630" cy="115" r="0.7"/><circle cx="665" cy="50" r="0.6"/>
        <circle cx="735" cy="105" r="0.8"/><circle cx="775" cy="45" r="0.7"/><circle cx="835" cy="110" r="0.6"/>
        <circle cx="875" cy="55" r="0.7"/><circle cx="935" cy="105" r="0.8"/><circle cx="995" cy="45" r="0.6"/>
        <circle cx="1055" cy="85" r="0.7"/>
      </g>

      <!-- Major Bright Stars with Glow -->
      <g fill="#ffffff" filter="url(#starGlow)">
        <circle cx="310" cy="45" r="2.2" class="sp-a"/>
        <circle cx="580" cy="50" r="2.4" class="sp-b"/>
        <circle cx="780" cy="38" r="2.0" class="sp-a"/>
        <circle cx="150" cy="70" r="1.9" class="sp-b"/>
        <circle cx="950" cy="45" r="2.1" class="sp-a"/>
      </g>
    </g>

    <!-- ==================== 2. WAVING NORTHERN LIGHTS (FAST AURORA) ==================== -->
    <g mask="url(#auroraMask)" filter="url(#auroraBlur)">
      <!-- Main Aurora Ribbon -->
      <path class="aurora-wave1" d="M -80,60 Q 150,15 380,55 T 820,40 T 1100,55 L 1100,165 L -80,165 Z" fill="url(#auroraGlow1)"/>
      
      <!-- Secondary Shimmering Curtain -->
      <path class="aurora-wave2" d="M -80,85 Q 220,40 500,80 T 920,45 T 1100,75 L 1100,175 L -80,175 Z" fill="url(#auroraGlow2)"/>
    </g>

    <!-- ==================== 3. PROGRESSIVE SWEEPING METEORS (LEFT TO RIGHT) ==================== -->
    
    <!-- [Wave 1: ระลอกที่ 1 จุดเริ่มเลื่อนจากซ้ายสุดไปขวาสุดอย่างต่อเนื่อง] -->
    <!-- จุด 1: x = 50 (ซ้ายสุด) -->
    <g transform="translate(50, -20)" class="sw-1">
      <line x1="-50" y1="-28" x2="0" y2="0" stroke="url(#mGradWhiteR)" stroke-width="2.2" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="2.2" fill="#ffffff" filter="url(#starGlow)"/>
    </g>
    <!-- จุด 2: x = 200 (ขยับมาซ้ายกลาง) -->
    <g transform="translate(200, -20)" class="sw-2">
      <line x1="-55" y1="-31" x2="0" y2="0" stroke="url(#mGradBlueR)" stroke-width="2.3" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="2.2" fill="#bae6fd" filter="url(#starGlow)"/>
    </g>
    <!-- จุด 3: x = 350 (ขยับมากลางซ้าย) -->
    <g transform="translate(350, -20)" class="sw-3">
      <line x1="-55" y1="-31" x2="0" y2="0" stroke="url(#mGradIndigoR)" stroke-width="2.1" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="2.1" fill="#c7d2fe" filter="url(#starGlow)"/>
    </g>
    <!-- จุด 4: x = 500 (ขยับมากลางจอ) -->
    <g transform="translate(500, -20)" class="sw-4">
      <line x1="-55" y1="-31" x2="0" y2="0" stroke="url(#mGradWhiteR)" stroke-width="2.1" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="2.1" fill="#ffffff" filter="url(#starGlow)"/>
    </g>
    <!-- จุด 5: x = 650 (ขยับมากลางขวา) -->
    <g transform="translate(650, -20)" class="sw-5">
      <line x1="-55" y1="-31" x2="0" y2="0" stroke="url(#mGradBlueR)" stroke-width="2.4" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="2.3" fill="#93c5fd" filter="url(#starGlow)"/>
    </g>
    <!-- จุด 6: x = 780 (ขยับมาฝั่งขวา) -->
    <g transform="translate(780, -20)" class="sw-6">
      <line x1="-30" y1="-45" x2="0" y2="0" stroke="url(#mGradIndigoR)" stroke-width="2.2" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="2.2" fill="#c7d2fe" filter="url(#starGlow)"/>
    </g>
    <!-- จุด 7: x = 860 (ขยับมาขวาสุด พุ่งตัดเข้าจอสวยงาม) -->
    <g transform="translate(860, -10)" class="sw-7">
      <line x1="45" y1="-32" x2="0" y2="0" stroke="url(#mGradBlueL)" stroke-width="2.3" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="2.2" fill="#bae6fd" filter="url(#starGlow)"/>
    </g>

    <!-- [Wave 2: ระลอกที่ 2 จุดเริ่มขยับตามจากซ้ายไปขวาเช่นกัน] -->
    <!-- จุด 8: x = 120 (ซ้าย) -->
    <g transform="translate(120, -15)" class="sw-8">
      <line x1="-50" y1="-28" x2="0" y2="0" stroke="url(#mGradBlueR)" stroke-width="2.2" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="2.1" fill="#bae6fd" filter="url(#starGlow)"/>
    </g>
    <!-- จุด 9: x = 270 (ซ้ายกลาง) -->
    <g transform="translate(270, -15)" class="sw-9">
      <line x1="-50" y1="-28" x2="0" y2="0" stroke="url(#mGradWhiteR)" stroke-width="2.0" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="2.0" fill="#ffffff" filter="url(#starGlow)"/>
    </g>
    <!-- จุด 10: x = 420 (กลางซ้าย) -->
    <g transform="translate(420, -15)" class="sw-10">
      <line x1="-55" y1="-31" x2="0" y2="0" stroke="url(#mGradIndigoR)" stroke-width="2.1" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="2.1" fill="#c7d2fe" filter="url(#starGlow)"/>
    </g>
    <!-- จุด 11: x = 570 (กลางขวา) -->
    <g transform="translate(570, -15)" class="sw-11">
      <line x1="-55" y1="-31" x2="0" y2="0" stroke="url(#mGradBlueR)" stroke-width="2.3" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="2.2" fill="#93c5fd" filter="url(#starGlow)"/>
    </g>
    <!-- จุด 12: x = 720 (ฝั่งขวา) -->
    <g transform="translate(720, -15)" class="sw-12">
      <line x1="-50" y1="-28" x2="0" y2="0" stroke="url(#mGradWhiteR)" stroke-width="2.1" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="2.1" fill="#ffffff" filter="url(#starGlow)"/>
    </g>
    <!-- จุด 13: x = 820 (ขวาชัดเจน) -->
    <g transform="translate(820, -15)" class="sw-13">
      <line x1="-30" y1="-45" x2="0" y2="0" stroke="url(#mGradIndigoR)" stroke-width="2.2" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="2.2" fill="#c7d2fe" filter="url(#starGlow)"/>
    </g>
    <!-- จุด 14: x = 880 (ขวาสุด) -->
    <g transform="translate(880, 10)" class="sw-14">
      <line x1="50" y1="-30" x2="0" y2="0" stroke="url(#mGradWhiteL)" stroke-width="2.2" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="2.1" fill="#ffffff" filter="url(#starGlow)"/>
    </g>

    <!-- ==================== 4. PINE FOREST SILHOUETTES ==================== -->
    <path d="M 0,205 
      L 15,190 L 30,205 L 45,185 L 60,208 L 75,192 L 95,210 L 115,180 L 135,212 L 155,195 L 180,215 
      L 205,182 L 230,210 L 255,190 L 280,212 L 310,185 L 335,210 L 360,195 L 390,215 L 420,180 
      L 450,210 L 480,188 L 515,212 L 545,182 L 575,210 L 605,190 L 635,215 L 670,185 L 700,210 
      L 730,192 L 760,215 L 795,180 L 825,210 L 855,188 L 880,212 L 900,195 L 900,240 L 0,240 Z" 
      fill="#090d24" opacity="0.85"/>

    <path d="M -10,240 
      L 5,175 L 20,205 L 35,165 L 50,205 L 70,160 L 90,208 L 110,170 L 130,210 
      L 150,155 L 175,215 L 200,175 L 225,210 L 250,160 L 275,208 L 305,170 L 330,212 
      L 355,150 L 380,215 L 410,165 L 440,210 L 470,155 L 500,212 L 530,168 L 560,210 
      L 590,145 L 620,212 L 650,160 L 680,208 L 710,150 L 740,212 L 770,165 L 800,210 
      L 830,155 L 860,208 L 885,160 L 910,240 Z" 
      fill="#02030a"/>

    <polygon points="50,145 42,165 47,165 38,185 45,185 32,210 68,210 55,185 62,185 53,165 58,165" fill="#02030a"/>
    <polygon points="120,135 110,160 116,160 105,185 112,185 98,215 142,215 128,185 135,185 124,160 130,160" fill="#02030a"/>
    <polygon points="360,132 350,155 356,155 345,180 352,180 338,210 382,210 370,180 376,180 366,155 372,155" fill="#02030a"/>
    <polygon points="695,130 685,155 692,155 680,180 688,180 675,212 715,212 702,180 710,180 698,155 705,155" fill="#02030a"/>

    <!-- Outer Border Glow -->
    <rect width="900" height="240" rx="16" ry="16" fill="none" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="1.5"/>
  </g>
</svg>
