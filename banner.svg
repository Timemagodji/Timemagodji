<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <!-- Deep Space Sky Gradient -->
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#010309"/>
      <stop offset="35%" stop-color="#030c1d"/>
      <stop offset="70%" stop-color="#061a28"/>
      <stop offset="100%" stop-color="#0a2a35"/>
    </linearGradient>

    <!-- Aurora Borealis Gradients -->
    <linearGradient id="auroraGreen1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0"/>
      <stop offset="25%" stop-color="#059669" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#34d399" stop-opacity="0.75"/>
      <stop offset="75%" stop-color="#06b6d4" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="auroraGreen2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0"/>
      <stop offset="30%" stop-color="#10b981" stop-opacity="0.6"/>
      <stop offset="65%" stop-color="#6ee7b7" stop-opacity="0.8"/>
      <stop offset="85%" stop-color="#047857" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="auroraVerticalFade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="80%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <mask id="auroraMask">
      <rect width="900" height="240" fill="url(#auroraVerticalFade)"/>
    </mask>

    <!-- Meteor Trails: White, Blue, Green -->
    <!-- White Meteor Trail -->
    <linearGradient id="tailWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#e0e7ff" stop-opacity="0.5"/>
      <stop offset="85%" stop-color="#f8fafc" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>

    <!-- Blue Meteor Trail -->
    <linearGradient id="tailBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.55"/>
      <stop offset="85%" stop-color="#bae6fd" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>

    <!-- Green Meteor Trail -->
    <linearGradient id="tailGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" stop-opacity="0"/>
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.55"/>
      <stop offset="85%" stop-color="#a7f3d0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="auroraBlur" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>

    <filter id="starGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    /* Aurora Wave Animations */
    @keyframes auroraWaveA {
      0%, 100% { transform: translateY(0px) skewX(0deg) scaleY(1); opacity: 0.65; }
      50% { transform: translateY(-12px) skewX(-4deg) scaleY(1.2); opacity: 0.95; }
    }
    @keyframes auroraWaveB {
      0%, 100% { transform: translateY(0px) skewX(2deg) scaleY(1.15); opacity: 0.5; }
      50% { transform: translateY(14px) skewX(-3deg) scaleY(0.9); opacity: 0.85; }
    }
    @keyframes auroraWaveC {
      0%, 100% { transform: translateY(0px) scaleX(1); opacity: 0.4; }
      50% { transform: translateY(-8px) scaleX(1.08); opacity: 0.75; }
    }

    .aurora-1 { animation: auroraWaveA 11s infinite ease-in-out; transform-origin: 450px 70px; }
    .aurora-2 { animation: auroraWaveB 14s infinite ease-in-out; transform-origin: 450px 90px; }
    .aurora-3 { animation: auroraWaveC 9s infinite ease-in-out; transform-origin: 450px 60px; }

    /* Twinkling stars */
    @keyframes twinkleA { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
    @keyframes twinkleB { 0%, 100% { opacity: 0.9; } 50% { opacity: 0.2; } }
    @keyframes twinkleC { 0%, 100% { opacity: 0.3; } 35% { opacity: 0.95; } 75% { opacity: 0.4; } }
    
    .tw-a { animation: twinkleA 2.5s infinite ease-in-out; }
    .tw-b { animation: twinkleB 3.4s infinite ease-in-out; }
    .tw-c { animation: twinkleC 4.2s infinite ease-in-out; }

    /* Diverse Meteor Streaks */
    @keyframes streakM {
      0% { transform: translate(0, 0); opacity: 0; }
      4% { opacity: 1; }
      18% { transform: translate(260px, 162px); opacity: 0; }
      100% { transform: translate(260px, 162px); opacity: 0; }
    }

    @keyframes streakFast {
      0% { transform: translate(0, 0); opacity: 0; }
      3% { opacity: 1; }
      14% { transform: translate(300px, 187px); opacity: 0; }
      100% { transform: translate(300px, 187px); opacity: 0; }
    }

    @keyframes streakSlow {
      0% { transform: translate(0, 0); opacity: 0; }
      5% { opacity: 1; }
      22% { transform: translate(230px, 144px); opacity: 0; }
      100% { transform: translate(230px, 144px); opacity: 0; }
    }

    /* 9 Staggered Meteors */
    .m-w1 { animation: streakM 3.8s infinite cubic-bezier(0.2, 0, 0.4, 1) 0.1s; }
    .m-g1 { animation: streakFast 4.2s infinite cubic-bezier(0.2, 0, 0.4, 1) 0.8s; }
    .m-b1 { animation: streakM 4.6s infinite cubic-bezier(0.2, 0, 0.4, 1) 1.5s; }
    .m-w2 { animation: streakSlow 4.0s infinite cubic-bezier(0.2, 0, 0.4, 1) 2.2s; }
    .m-g2 { animation: streakM 5.1s infinite cubic-bezier(0.2, 0, 0.4, 1) 2.9s; }
    .m-b2 { animation: streakFast 3.9s infinite cubic-bezier(0.2, 0, 0.4, 1) 3.5s; }
    .m-w3 { animation: streakM 4.4s infinite cubic-bezier(0.2, 0, 0.4, 1) 4.2s; }
    .m-g3 { animation: streakSlow 4.8s infinite cubic-bezier(0.2, 0, 0.4, 1) 0.4s; }
    .m-b3 { animation: streakM 5.4s infinite cubic-bezier(0.2, 0, 0.4, 1) 2.6s; }
  </style>

  <!-- Card Clipping with rounded corners -->
  <clipPath id="cardClip">
    <rect width="900" height="240" rx="16" ry="16"/>
  </clipPath>

  <g clip-path="url(#cardClip)">
    <!-- Night Sky Base -->
    <rect width="900" height="240" fill="url(#nightSky)"/>

    <!-- ==================== AURORA BOREALIS LAYERS ==================== -->
    <g mask="url(#auroraMask)" filter="url(#auroraBlur)">
      <!-- Aurora Ribbon 1 (Emerald & Mint) -->
      <path class="aurora-1" d="M -50,65 Q 120,20 280,60 T 600,45 T 950,55 L 950,150 L -50,150 Z" fill="url(#auroraGreen1)"/>
      
      <!-- Aurora Ribbon 2 (Cyan & Bright Jade) -->
      <path class="aurora-2" d="M -50,85 Q 180,45 380,80 T 720,50 T 950,75 L 950,165 L -50,165 Z" fill="url(#auroraGreen2)"/>
      
      <!-- Aurora Ribbon 3 (High Atmosphere Hue) -->
      <path class="aurora-3" d="M -50,45 Q 220,10 460,50 T 820,35 T 950,45 L 950,135 L -50,135 Z" fill="url(#auroraGreen1)" opacity="0.6"/>
    </g>

    <!-- Stars: Layer A (White Shimmer) -->
    <g fill="#ffffff" class="tw-a">
      <circle cx="45" cy="28" r="1"/>
      <circle cx="120" cy="75" r="1.2"/>
      <circle cx="210" cy="35" r="0.9"/>
      <circle cx="280" cy="90" r="1.4"/>
      <circle cx="360" cy="40" r="1"/>
      <circle cx="430" cy="85" r="1.3"/>
      <circle cx="510" cy="30" r="1"/>
      <circle cx="590" cy="70" r="1.5"/>
      <circle cx="670" cy="45" r="1.1"/>
      <circle cx="750" cy="80" r="1.3"/>
      <circle cx="830" cy="35" r="1"/>
      <circle cx="875" cy="95" r="1.2"/>
    </g>

    <!-- Stars: Layer B (Mint Shimmer) -->
    <g fill="#a7f3d0" class="tw-b">
      <circle cx="85" cy="55" r="1.2"/>
      <circle cx="160" cy="25" r="1"/>
      <circle cx="240" cy="65" r="1.5"/>
      <circle cx="310" cy="20" r="1.1"/>
      <circle cx="395" cy="60" r="1.3"/>
      <circle cx="475" cy="45" r="1"/>
      <circle cx="550" cy="95" r="1.4"/>
      <circle cx="630" cy="25" r="1"/>
      <circle cx="710" cy="60" r="1.5"/>
      <circle cx="790" cy="20" r="1.1"/>
      <circle cx="860" cy="65" r="1.3"/>
    </g>

    <!-- Stars: Layer C (Dense Background Dust) -->
    <g fill="#bae6fd" opacity="0.6" class="tw-c">
      <circle cx="25" cy="45" r="0.6"/>
      <circle cx="65" cy="110" r="0.6"/>
      <circle cx="105" cy="40" r="0.7"/>
      <circle cx="140" cy="100" r="0.8"/>
      <circle cx="185" cy="60" r="0.6"/>
      <circle cx="225" cy="115" r="0.7"/>
      <circle cx="260" cy="50" r="0.6"/>
      <circle cx="330" cy="75" r="0.8"/>
      <circle cx="375" cy="110" r="0.6"/>
      <circle cx="415" cy="30" r="0.7"/>
      <circle cx="450" cy="65" r="0.7"/>
      <circle cx="490" cy="110" r="0.8"/>
      <circle cx="530" cy="55" r="0.6"/>
      <circle cx="570" cy="115" r="0.7"/>
      <circle cx="610" cy="40" r="0.6"/>
      <circle cx="655" cy="75" r="0.8"/>
      <circle cx="700" cy="30" r="0.6"/>
      <circle cx="735" cy="110" r="0.6"/>
      <circle cx="770" cy="50" r="0.7"/>
      <circle cx="815" cy="95" r="0.8"/>
      <circle cx="850" cy="35" r="0.7"/>
      <circle cx="885" cy="60" r="0.6"/>
    </g>

    <!-- Glowing Major Stars -->
    <g fill="#ffffff" filter="url(#starGlow)">
      <circle cx="340" cy="45" r="2" class="tw-a"/>
      <circle cx="585" cy="60" r="2.2" class="tw-b"/>
      <circle cx="760" cy="35" r="1.8" class="tw-a"/>
      <circle cx="190" cy="80" r="1.8" class="tw-b"/>
      <circle cx="465" cy="90" r="1.6" class="tw-c"/>
    </g>

    <!-- ==================== DENSE MULTI-COLOR METEOR SHOWER ==================== -->
    <!-- 1. White Meteor -->
    <g class="m-w1">
      <line x1="50" y1="5" x2="140" y2="61" stroke="url(#tailWhite)" stroke-width="2.2" stroke-linecap="round"/>
      <circle cx="140" cy="61" r="2.2" fill="#ffffff" filter="url(#starGlow)"/>
    </g>

    <!-- 2. Green Meteor -->
    <g class="m-g1">
      <line x1="280" y1="2" x2="365" y2="55" stroke="url(#tailGreen)" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="365" cy="55" r="2.4" fill="#a7f3d0" filter="url(#starGlow)"/>
    </g>

    <!-- 3. Blue Meteor -->
    <g class="m-b1">
      <line x1="490" y1="10" x2="590" y2="72" stroke="url(#tailBlue)" stroke-width="2.4" stroke-linecap="round"/>
      <circle cx="590" cy="72" r="2.3" fill="#bae6fd" filter="url(#starGlow)"/>
    </g>

    <!-- 4. White Meteor (Mid-Sky) -->
    <g class="m-w2">
      <line x1="180" y1="25" x2="255" y2="72" stroke="url(#tailWhite)" stroke-width="1.8" stroke-linecap="round"/>
      <circle cx="255" cy="72" r="1.8" fill="#ffffff" filter="url(#starGlow)"/>
    </g>

    <!-- 5. Green Meteor (Deep Jade) -->
    <g class="m-g2">
      <line x1="680" y1="12" x2="765" y2="65" stroke="url(#tailGreen)" stroke-width="2.2" stroke-linecap="round"/>
      <circle cx="765" cy="65" r="2.2" fill="#6ee7b7" filter="url(#starGlow)"/>
    </g>

    <!-- 6. Blue Meteor (Fast Electric Blue) -->
    <g class="m-b2">
      <line x1="390" y1="15" x2="475" y2="68" stroke="url(#tailBlue)" stroke-width="2.0" stroke-linecap="round"/>
      <circle cx="475" cy="68" r="2.0" fill="#38bdf8" filter="url(#starGlow)"/>
    </g>

    <!-- 7. White Meteor (Far Right) -->
    <g class="m-w3">
      <line x1="770" y1="20" x2="845" y2="67" stroke="url(#tailWhite)" stroke-width="1.9" stroke-linecap="round"/>
      <circle cx="845" cy="67" r="1.9" fill="#ffffff" filter="url(#starGlow)"/>
    </g>

    <!-- 8. Green Meteor (High Sky) -->
    <g class="m-g3">
      <line x1="110" y1="18" x2="190" y2="68" stroke="url(#tailGreen)" stroke-width="2.0" stroke-linecap="round"/>
      <circle cx="190" cy="68" r="2.0" fill="#a7f3d0" filter="url(#starGlow)"/>
    </g>

    <!-- 9. Blue Meteor (Lower Skyline) -->
    <g class="m-b3">
      <line x1="580" y1="30" x2="660" y2="80" stroke="url(#tailBlue)" stroke-width="1.8" stroke-linecap="round"/>
      <circle cx="660" cy="80" r="1.8" fill="#7dd3fc" filter="url(#starGlow)"/>
    </g>

    <!-- ==================== PINE FOREST SILHOUETTES ==================== -->
    <!-- Distant Forest Layer -->
    <path d="M 0,205 
      L 15,190 L 30,205 L 45,185 L 60,208 L 75,192 L 95,210 L 115,180 L 135,212 L 155,195 L 180,215 
      L 205,182 L 230,210 L 255,190 L 280,212 L 310,185 L 335,210 L 360,195 L 390,215 L 420,180 
      L 450,210 L 480,188 L 515,212 L 545,182 L 575,210 L 605,190 L 635,215 L 670,185 L 700,210 
      L 730,192 L 760,215 L 795,180 L 825,210 L 855,188 L 880,212 L 900,195 L 900,240 L 0,240 Z" 
      fill="#03131c" opacity="0.85"/>

    <!-- Foreground Dense Pine Silhouettes -->
    <path d="M -10,240 
      L 5,175 L 20,205 L 35,165 L 50,205 L 70,160 L 90,208 L 110,170 L 130,210 
      L 150,155 L 175,215 L 200,175 L 225,210 L 250,160 L 275,208 L 305,170 L 330,212 
      L 355,150 L 380,215 L 410,165 L 440,210 L 470,155 L 500,212 L 530,168 L 560,210 
      L 590,145 L 620,212 L 650,160 L 680,208 L 710,150 L 740,212 L 770,165 L 800,210 
      L 830,155 L 860,208 L 885,160 L 910,240 Z" 
      fill="#010406"/>

    <!-- Prominent pine crowns -->
    <polygon points="50,145 42,165 47,165 38,185 45,185 32,210 68,210 55,185 62,185 53,165 58,165" fill="#010406"/>
    <polygon points="120,135 110,160 116,160 105,185 112,185 98,215 142,215 128,185 135,185 124,160 130,160" fill="#010406"/>
    <polygon points="360,132 350,155 356,155 345,180 352,180 338,210 382,210 370,180 376,180 366,155 372,155" fill="#010406"/>
    <polygon points="695,130 685,155 692,155 680,180 688,180 675,212 715,212 702,180 710,180 698,155 705,155" fill="#010406"/>

    <!-- Outer Border Glow -->
    <rect width="900" height="240" rx="16" ry="16" fill="none" stroke="#34d399" stroke-opacity="0.3" stroke-width="1.5"/>
  </g>
</svg>
